<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMDB</title>

    <!-- Lien vers Bootstrap -->
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css" />

    <!-- Lien vers les icônes Bootstrap -->
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.min.css">

    <!-- Lien pour utiliser JavaScript pour les actions de l'utilisateur -->
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <header>
        <div id="nom-Page" class="mb-5">
            <h1 class="text-center">Liste des films de la semaine</h1>
            <h2 class="text-center">Voici la liste des films du moment !</h2>
        </div>
        <div class="d-flex justify-content-center mb-5">
            <div class="w-100 d-flex justify-content-center">
                <form class="d-flex justify-content-center w-100" action="index.html">
                    <input class="searchBar mx-3" id="search" type="search" placeholder="Rechercher un Film..."
                        name="search">
                    <button class="btn colorBtnRechercher">Rechercher</button>
                    <select class="select mx-3" name="select" id="select-Language">
                        <option value="fr-FR">fr-FR</option>
                        <option value="en-EN">en-EN</option>
                        <option value="jp-JP">jp-JP</option>
                        <option value="es-ES">es-ES</option>
                        <option value="de-DE">de-DE</option>
                    </select>
                </form>
            </div>
        </div>
    </header>

    <main class="d-flex justify-content-center">
        <div class="tailleListeFilms" id="listeFilms">

        </div>
    </main>

    <script src="js/script.js"></script>
</body>

</html>
